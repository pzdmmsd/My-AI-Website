<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NVIDIA NIM Chat</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- ── Login overlay ── -->
    <div class="login-overlay" id="loginOverlay" aria-modal="true" role="dialog" aria-label="Login" hidden>
      <div class="login-card">
        <div class="login-logo">
          <svg viewBox="0 0 32 32" width="40" height="40">
            <rect width="32" height="32" rx="8" fill="#1a1a2e"/>
            <circle cx="16" cy="10" r="3" fill="none" stroke="#76d9e6" stroke-width="1.5"/>
            <circle cx="8"  cy="20" r="2.5" fill="none" stroke="#76d9e6" stroke-width="1.5"/>
            <circle cx="24" cy="20" r="2.5" fill="none" stroke="#76d9e6" stroke-width="1.5"/>
            <circle cx="16" cy="24" r="2.5" fill="none" stroke="#76d9e6" stroke-width="1.5"/>
            <line x1="16" y1="13" x2="10" y2="18" stroke="#76d9e6" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="16" y1="13" x2="22" y2="18" stroke="#76d9e6" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="10" y1="22" x2="15" y2="22" stroke="#76d9e6" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="22" y1="22" x2="17" y2="22" stroke="#76d9e6" stroke-width="1.2" stroke-linecap="round"/>
            <circle cx="16" cy="10" r="1.5" fill="#76d9e6"/>
            <circle cx="8"  cy="20" r="1" fill="#76d9e6"/>
            <circle cx="24" cy="20" r="1" fill="#76d9e6"/>
            <circle cx="16" cy="24" r="1" fill="#76d9e6"/>
          </svg>
        </div>
        <h2 class="login-title">NVIDIA NIM Chat</h2>
        <p class="login-sub">Sign in to continue</p>
        <form id="loginForm" class="login-form" autocomplete="on">
          <label class="login-label">
            Username
            <input id="loginUsername" type="text" autocomplete="username" placeholder="Enter username" required />
          </label>
          <label class="login-label">
            Password
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password" required />
          </label>
          <p class="login-error" id="loginError" hidden></p>
          <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
        </form>
      </div>
    </div>

    <!-- ── Main app ── -->
    <main class="app-shell" id="appShell" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <div class="sidebar-brand">
            <p class="eyebrow">NVIDIA NIM</p>
            <h1>Chats</h1>
          </div>
          <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Collapse sidebar" aria-controls="sidebar" aria-expanded="true" title="Collapse sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM9 5v14M15 9l-3 3 3 3" /></svg>
          </button>
        </div>

        <button class="new-chat" id="newChatButton" type="button" aria-label="New chat" title="New chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span>New chat</span>
        </button>
        <nav class="conversation-list" id="conversationList" aria-label="Conversations"></nav>

        <details class="settings" id="settingsPanel" open>
          <summary>Settings</summary>
          <div class="settings-grid">
            <label>
              <span>Model</span>
              <select id="modelSelect"></select>
            </label>

            <label>
              <span>System prompt</span>
              <textarea id="systemInput" rows="4">You are a precise, direct, helpful AI assistant.</textarea>
            </label>

            <label>
              <span>Temperature <output id="temperatureValue">0.3</output></span>
              <input id="temperatureInput" type="range" min="0" max="1.5" step="0.1" value="0.3" />
            </label>

            <label>
              <span>Max output</span>
              <input id="maxTokensInput" type="number" min="1" step="1" placeholder="No limit" />
            </label>

            <div class="settings-block color-setting">
              <span>Color</span>
              <input id="colorSelect" type="hidden" value="blue" />
              <div class="color-options" role="radiogroup" aria-label="Theme color">
                <button class="color-dot color-dot-blue" type="button" data-color-option="blue" role="radio" aria-label="Blue"></button>
                <button class="color-dot color-dot-green" type="button" data-color-option="green" role="radio" aria-label="Green"></button>
                <button class="color-dot color-dot-purple" type="button" data-color-option="purple" role="radio" aria-label="Purple"></button>
                <button class="color-dot color-dot-rose" type="button" data-color-option="rose" role="radio" aria-label="Rose"></button>
              </div>
            </div>

            <button class="settings-command" id="changePasswordBtn" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7a4 4 0 1 1-2.5 3.7L3 20l3-1 1-3 3-1 2.3-2.3M17 7h.01" /></svg>
              <span>Change password</span>
            </button>
          </div>
        </details>

        <div class="sidebar-actions">
          <button id="themeButton" type="button" title="Theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a7.5 7.5 0 1 0 7.5 7.5A6 6 0 0 1 12 3Z" /></svg>
            <span>Theme</span>
          </button>
          <button id="exportButton" type="button" title="Export">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14" /></svg>
            <span>Export</span>
          </button>
        </div>

        <!-- User info bar -->
        <div class="user-bar">
          <div class="user-bar-info">
            <div class="user-bar-avatar" id="userAvatar">?</div>
            <div>
              <div class="user-bar-name" id="userName">—</div>
              <div class="user-bar-role" id="userRole">user</div>
            </div>
          </div>
          <div class="user-bar-actions">
            <button class="user-bar-btn" id="adminPanelBtn" title="Admin panel" hidden>
              <svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.4 2.9 8.4 7 10 4.1-1.6 7-5.6 7-10V6l-7-3Z M9.5 12l1.8 1.8 3.7-4" /></svg>
            </button>
            <button class="user-bar-btn" id="logoutButton" title="Logout">
              <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" /></svg>
            </button>
          </div>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <section class="chat-pane" aria-label="Chat">
        <header class="chat-header">
          <div class="chat-title-wrap">
            <p class="eyebrow" id="activeModelLabel">Model</p>
            <h2 id="chatTitle" title="Double-click to rename">New chat</h2>
          </div>
          <button id="stopButton" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h7a5 5 0 0 1 0 10H8m0 0 4-4m-4 4 4 4" /></svg>
            <span>Stop</span>
          </button>
        </header>

        <div class="messages" id="messages" aria-live="polite"></div>

        <form class="composer" id="chatForm">
          <div class="attachment-row" id="attachmentRow" hidden></div>
          <div class="composer-main">
            <input id="fileInput" type="file" multiple hidden />
            <button class="icon-button" id="attachButton" type="button" title="Upload files" aria-label="Upload files">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 12.5-8.8 8.8a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 1 1-2.8-2.8l8.5-8.5" /></svg>
              <span>Files</span>
            </button>
            <button class="icon-button" id="webModeButton" type="button" aria-pressed="false" title="Web mode">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM3.6 9h16.8M3.6 15h16.8M12 3c2 2.4 3 5.4 3 9s-1 6.6-3 9M12 3c-2 2.4-3 5.4-3 9s1 6.6 3 9" /></svg>
              <span>Web</span>
            </button>
            <textarea id="promptInput" rows="1" placeholder="Message"></textarea>
            <button id="sendButton" type="submit">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-7 14-2-5-5-2Z" /></svg>
              <span>Send</span>
            </button>
          </div>
          <p class="composer-disclaimer">这是一款 AI 工具，其回答未必正确无误。</p>
        </form>
      </section>
    </main>

    <div class="modal-overlay" id="passwordModal">
      <div class="account-modal">
        <h3>Change Password</h3>
        <label>
          <span>Current password</span>
          <input id="currentPasswordInput" type="password" autocomplete="current-password" />
        </label>
        <label>
          <span>New password</span>
          <input id="newPasswordInput" type="password" autocomplete="new-password" />
        </label>
        <p class="modal-error" id="passwordModalError" hidden></p>
        <div class="modal-actions">
          <button class="modal-secondary" id="passwordCancelBtn" type="button">Cancel</button>
          <button id="passwordSaveBtn" type="button">Save</button>
        </div>
      </div>
    </div>

    <template id="messageTemplate">
      <article class="message">
        <div class="message-meta"></div>
        <div class="message-body"></div>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
